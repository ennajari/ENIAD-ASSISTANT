name: ENIAD Assistant CI/CD Pipeline

on:
  push:
    branches: [ main, dev-* ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint-and-format:
    name: Linting & Static Analysis
    runs-on: [self-hosted, dual_portfolio_linux_runner, linux]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black pytest

      - name: Python Syntax & Compilation Verification
        run: |
          python -m py_compile SMA_Service/main.py RAG_Project/src/main.py

      - name: Frontend Dependencies & Lint
        run: |
          cd chatbot-ui
          npm ci
          npm run build

  unit-tests:
    name: Automated Unit Testing
    needs: lint-and-format
    runs-on: [self-hosted, dual_portfolio_linux_runner, linux]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx

      - name: Run Backend Pytest Suite
        run: |
          pytest tests/ -v

  security-scan:
    name: Security & Credential Protection Scan
    needs: lint-and-format
    runs-on: [self-hosted, dual_portfolio_linux_runner, linux]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check for Uncommitted Secret Files
        run: |
          if [ -f .env ] && git ls-files --error-unmatch .env > /dev/null 2>&1; then
            echo "❌ ERROR: .env file is tracked by git!"
            exit 1
          else
            echo "✅ Security Check Passed: .env is excluded from git tracking."
          fi

  docker-build-verification:
    name: Docker Image Verification
    needs: [unit-tests, security-scan]
    runs-on: [self-hosted, dual_portfolio_linux_runner, linux]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config
