version: '3.8'

services:
  mongodb:
    image: mongo:7-jammy
    container_name: eniad_mongodb
    ports:
      - "27007:27017"
    volumes:
      - mongodata:/data/db
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    environment:
      - MONGO_INITDB_ROOT_USERNAME=eniad_admin
      - MONGO_INITDB_ROOT_PASSWORD=eniad_password_2024
      - MONGO_INITDB_DATABASE=eniad_rag_db
    networks:
      - eniad_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: eniad_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    networks:
      - eniad_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  eniad_network:
    driver: bridge

volumes:
  mongodata:
    driver: local
  qdrant_data:
    driver: local
